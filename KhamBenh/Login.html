<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to Account</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Background decorative elements */
        .bg-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50px;
        }

        .shape-1 {
            width: 300px;
            height: 300px;
            top: -100px;
            left: -100px;
            transform: rotate(-45deg);
        }

        .shape-2 {
            width: 400px;
            height: 400px;
            bottom: -150px;
            right: -150px;
            transform: rotate(30deg);
        }

        .shape-3 {
            width: 200px;
            height: 200px;
            top: 50%;
            left: -50px;
            transform: translateY(-50%) rotate(60deg);
        }

        .shape-4 {
            width: 250px;
            height: 250px;
            top: 20%;
            right: -80px;
            transform: rotate(-30deg);
        }

        /* Login container */
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 10;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s ease;
            background: #f8f9fa;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }

        .password-input {
            position: relative;
        }

        .password-dots {
            font-size: 18px;
            letter-spacing: 4px;
            color: #999;
        }

        .sign-in-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-bottom: 20px;
        }

        .sign-in-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .sign-in-btn:active {
            transform: translateY(0);
        }

        .footer-text {
            text-align: center;
            font-size: 14px;
            color: #666;
        }

        .create-account-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .create-account-link:hover {
            color: #764ba2;
        }

        /* Responsive design */
        @media (max-width: 480px) {
            .login-container {
                margin: 20px;
                padding: 30px;
            }
            
            .shape {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
    </div>

    <div class="login-container">
        <div class="login-header">
            <h1>Login to Account</h1>
            <p>Please enter your username and password to continue</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username:</label>
                <input 
                    type="username" 
                    id="username" 
                    class="form-input" 
                    placeholder="Username"
                    
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-input" placeholder="••••••">
                <!-- <div class="password-input">
                    <div class="form-input password-dots">••••••</div>
                </div> -->
            </div>

            <button type="submit" class="sign-in-btn">Sign In</button>
        </form>

        <div class="footer-text">
            Don't have an account? <a href="SignUp.html" class="create-account-link">Create Account</a>
        </div>
    </div>

    <script >
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (password.length <= 6) {
        alert('Mật khẩu phải có nhiều hơn 6 ký tự.');
        return;
    }

    try {
        const response = await fetch('http://localhost:8080/svc-auth/api/login', { // đổi URL theo server của bạn
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ username, password })
        });

        if (!response.ok) {
            const errorData = await response.json();
            throw new Error(errorData.message || 'Login failed');
        }

        const data = await response.json();
        console.log('Đăng nhập thành công:', data);

        // Ví dụ: lưu token nếu có
        localStorage.setItem('token', data.token);
        const decoded = jwt_decode(data.access); // giả sử bạn đã import hoặc dùng thư viện jwt-decode
    const roles = decoded.roles || [];

    // Kiểm tra role để điều hướng
    if (roles.includes('DOCTOR')) {
        window.location.href = 'MainHome.html';
    } else if (roles.includes('PATIENT')) {
        window.location.href = 'PatientHome.html';
    } else {
        window.location.href = 'MainHome.html';  // mặc định
    }

        // Chuyển trang
        // window.location.href = 'MainHome.html';

    } catch (error) {
        alert('Đăng nhập thất bại: ' + error.message);
    }
});

        // Thêm hiệu ứng nhập password thật
        const passwordContainer = document.querySelector('.password-input');
        passwordContainer.addEventListener('click', function() {
            const passwordDiv = this.querySelector('.password-dots');
            const input = document.createElement('input');
            input.type = 'password';
            input.className = 'form-input';
            input.placeholder = 'Enter your password';
            input.style.position = 'absolute';
            input.style.top = '0';
            input.style.left = '0';
            input.style.width = '100%';
            input.style.background = 'white';
            
            this.style.position = 'relative';
            this.appendChild(input);
            input.focus();
            
            input.addEventListener('blur', function() {
                if (this.value === '') {
                    this.remove();
                }
            });
        });
    </script>
</body>
</html>
