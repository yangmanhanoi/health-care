<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Home Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Main container */
        .main-container {
            background: white;
            padding: 60px 80px;
            border-radius: 12px;
            border: 2px solid #e8eaed;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            position: relative;
            z-index: 10;
            min-width: 400px;
        }

        .main-title {
            font-size: 32px;
            font-weight: 600;
            color: #4285f4;
            margin-bottom: 30px;
            letter-spacing: -0.5px;
        }

        .booking-btn {
            background: #4285f4;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(66, 133, 244, 0.3);
        }

        .booking-btn:hover {
            background: #3367d6;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(66, 133, 244, 0.4);
        }

        .booking-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(66, 133, 244, 0.3);
        }

        /* Responsive design */
        @media (max-width: 600px) {
            .main-container {
                margin: 20px;
                padding: 40px 30px;
                min-width: auto;
                width: calc(100% - 40px);
            }

            .main-title {
                font-size: 28px;
                margin-bottom: 25px;
            }

            .decorative-line {
                display: none;
            }
        }

        @media (max-width: 400px) {
            .main-container {
                padding: 30px 20px;
            }

            .main-title {
                font-size: 24px;
            }

            .booking-btn {
                font-size: 14px;
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="decorative-line"></div>

    <div class="main-container">
        <h1 class="main-title">Main Home Page</h1>
        <button class="booking-btn" onclick="handleBooking()">Đặt lịch khám</button><br><br>
        <button class="booking-btn" onclick="handleChatbot()">ChatBot</button>
    </div>

    <script>
        function handleBooking() {
            // Chuyển hướng đến trang Booking.html
            window.location.href = 'Booking.html';
        }

        function handleChatbot() {
            // Chuyển hướng đến trang Booking.html
            window.location.href = 'Chatbot.html';
        }

        // Thêm hiệu ứng fade in khi load trang
        document.addEventListener('DOMContentLoaded', function () {
            const container = document.querySelector('.main-container');
            container.style.opacity = '0';
            container.style.transform = 'translateY(20px)';

            setTimeout(() => {
                container.style.transition = 'all 0.6s ease';
                container.style.opacity = '1';
                container.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body>
</html>
