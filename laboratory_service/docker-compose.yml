version: '3.8'

services:
  laboratory-service:
    build: .
    ports:
      - "8006:8000"  # Assuming port 8006 for laboratory service
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DJANGO_SETTINGS_MODULE=laboratory_service.settings
      # Override database connection settings for Docker
      - POSTGRES_DB=laboratory_db
      - POSTGRES_USER=namdt25
      - POSTGRES_PASSWORD=namdt25
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    volumes:
      - .:/app
    restart: always
    # Using entrypoint script from Dockerfile

  db:
    image: postgres:13
    ports:
      - "5433:5432"  # Changed to 5433 to avoid conflicts with host PostgreSQL
    environment:
      - POSTGRES_DB=laboratory_db
      - POSTGRES_USER=namdt25
      - POSTGRES_PASSWORD=namdt25
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U namdt25 -d laboratory_db"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
